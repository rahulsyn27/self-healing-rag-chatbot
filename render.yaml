services:
  - type: web
    name: self-healing-rag-backend
    env: python
    region: oregon # or frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: GROQ_API_KEY
        sync: false # We will add this securely in the Render dashboard